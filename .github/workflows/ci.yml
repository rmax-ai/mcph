name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Assert dev tools are installed
        run: |
          uv run --no-sync ruff --version
          uv run --no-sync mypy --version
          uv run --no-sync pytest --version

      - name: Lint
        run: uv run --no-sync ruff check src/ tests/

      - name: Format check
        run: uv run --no-sync ruff format --check src/ tests/

      - name: Type check
        run: uv run --no-sync mypy src/

      - name: Test
        run: uv run --no-sync pytest tests/ -v
